name: breast_cancer_dl

services:
  # MongoDB Cloud or Local Container
  mongodb:
    image: mongo:6.0
    container_name: breast_cancer_db
    restart: always
    ports:
      - "${MONGO_PORT:-27018}:27017"
    environment:
      MONGO_INITDB_DATABASE: breast_cancer_db
    volumes:
      - mongo_data:/data/db
    networks:
      - breast_cancer_network

  # Python FastAPI AI Microservice (PyTorch + MONAI + Grad-CAM)
  ai_service:
    build:
      context: .
      dockerfile: ai_service/Dockerfile
    container_name: breast_cancer_ai_service
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - CORS_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./data:/app/data:ro
    networks:
      - breast_cancer_network

  # Node.js + Express Backend REST API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: breast_cancer_server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/breast_cancer_db
      - JWT_SECRET=super_secure_breast_cancer_dl_jwt_secret_key_2026
      - AI_SERVICE_URL=http://ai_service:8000
      - CLIENT_URL=http://localhost
    depends_on:
      - mongodb
      - ai_service
    volumes:
      - server_uploads:/app/uploads
      - server_reports:/app/reports
    networks:
      - breast_cancer_network

  # React Frontend Client (Nginx)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: breast_cancer_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - breast_cancer_network

volumes:
  mongo_data:
  server_uploads:
  server_reports:

networks:
  breast_cancer_network:
    driver: bridge
